<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13101a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Sarimihetsika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Studio diaporama : sary, vidéo, mozika, effets, transitions ary filaharana kisendrasendra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@700;800&family=Dancing+Script:wght@600&family=Bebas+Neue&family=Montserrat:wght@600;800&family=Lora:wght@500;700&family=Pacifico&family=Gochi+Hand&family=Caveat:wght@600;700&family=Amatic+SC:wght@700&display=swap">
<style>
/* Layout: a dark lightbox stage and a film-strip timeline on the left, a tool drawer on the right */
:root{
  --bg:#f2f0f6; --surface:#ffffff; --surface-2:#e9e5f0; --line:#d8d2e2; --fg:#1d1828; --muted:#5f586f;
  --accent:#e8921f; --accent-ink:#1d1206; --accent-text:#9a5600; --teal:#0e8a7d; --danger:#c23b3b;
  --stage:#0b0a10; --strip:#1a1622; --strip-fg:#eee8f5; --strip-muted:#a59db4; --perf:#2f2939;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13101a; --surface:#1c1826; --surface-2:#282237; --line:#372f47; --fg:#f2ede7; --muted:#a69eb6;
    --accent:#f4a53a; --accent-ink:#1d1206; --accent-text:#f7b862; --teal:#45c9b9; --danger:#ff7a7a;
    --stage:#07060a; --strip:#0f0d15; --strip-fg:#eee8f5; --strip-muted:#a59db4; --perf:#231e2d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13101a; --surface:#1c1826; --surface-2:#282237; --line:#372f47; --fg:#f2ede7; --muted:#a69eb6;
  --accent:#f4a53a; --accent-ink:#1d1206; --accent-text:#f7b862; --teal:#45c9b9; --danger:#ff7a7a;
  --stage:#07060a; --strip:#0f0d15; --strip-fg:#eee8f5; --strip-muted:#a59db4; --perf:#231e2d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{min-height:100%;display:flex;flex-direction:column}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap;max-width:1640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font:800 19px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:600 10px/1.4 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.steps{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}
.step:hover{border-color:var(--accent)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:600 12px var(--f-mono)}
.step .n .ic{width:14px;height:14px;stroke-width:2.4}
.step.is-done .n{background:var(--teal);color:#fff}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.icon{width:38px;padding:0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.mini{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.mini .ic{width:16px;height:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{background:var(--danger);border-color:var(--danger);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
@media (max-width:720px){.btn .lbl-hide{display:none}.btn.has-lbl{padding:0 11px}}

/* Tip */
.tip-wrap{max-width:1640px;margin:0 auto;width:100%;padding-block:12px 0}
.tip{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:14px}
.tip p{margin:0;flex:1;min-width:0}

/* Workspace */
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;padding-block:14px 28px;align-items:start;max-width:1640px;margin:0 auto;width:100%}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}

.stage{touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;background:var(--stage);border-radius:16px;display:grid;place-items:center;padding:14px;min-height:220px;overflow:hidden;cursor:pointer}
.stage canvas{display:block;max-width:100%;max-height:min(60vh,660px);width:auto;height:auto;border-radius:6px;box-shadow:0 24px 60px rgb(0 0 0 / .55)}
.stage:fullscreen{border-radius:0;padding:0;background:#000}
.stage:fullscreen canvas{max-height:100vh;border-radius:0;box-shadow:none}
.stage.is-kiosk{position:fixed;inset:0;z-index:100;border-radius:0;padding:0;background:#000}
.stage.is-kiosk canvas{max-height:100vh;max-height:100dvh;border-radius:0;box-shadow:none}
.hud{position:absolute;top:12px;left:12px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 8px;border-radius:6px;background:rgb(0 0 0 / .6);color:#f2ede7}
.chip.amber{background:#f4a53a;color:#1d1206}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#eee8f5;padding:24px}
.stage-empty p{margin:10px 0 16px;color:#a59db4;max-width:36ch}
.stage-empty h3{margin:0;font:700 22px var(--f-display)}
.kiosk-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:none;background:rgb(0 0 0 / .6);color:#fff;border-color:transparent}
.stage.is-kiosk .kiosk-x{display:inline-flex}

.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.tp-btn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.tp-btn:hover{background:var(--surface-2)}
.tp-play{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.tp-play:hover{background:var(--accent);filter:brightness(1.06)}
.tp-play .ic{width:22px;height:22px}
.scrub{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.time{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%;margin:0;height:22px}
.tp-toggle{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--fg)}
.tp-toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent-text)}
.tp-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:680px){.scrub{order:-1;flex-basis:100%}.tp-lbl{display:none}.tp-toggle{padding:0 10px}}

/* Film strip */
.strip-wrap{background:var(--strip);color:var(--strip-fg);border-radius:14px;padding:12px 0 8px;min-width:0}
.strip-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:0 14px 6px}
.strip-head h2{font:700 15px var(--f-display);margin:0}
.strip-head .meta{font:500 12px var(--f-mono);color:var(--strip-muted)}
.strip-head .hint{margin-left:auto;color:var(--strip-muted);font-size:12px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:16px 14px;
  background:
    radial-gradient(circle at 6px 4px,var(--perf) 2.6px,transparent 3.2px) 0 0/20px 8px repeat-x,
    radial-gradient(circle at 6px 4px,var(--perf) 2.6px,transparent 3.2px) 0 100%/20px 8px repeat-x;
  background-attachment:local;scrollbar-color:var(--perf) transparent}
.clip{flex:none;width:136px;border-radius:8px;background:#000;position:relative;cursor:grab;box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.clip:active{cursor:grabbing}
.clip-img{aspect-ratio:16/10;border-radius:8px 8px 0 0;overflow:hidden;background:#221d2c;display:grid;place-items:center;color:#5d546c}
.clip-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.clip-meta{display:flex;align-items:center;gap:6px;padding:5px 8px;font:500 11px var(--f-mono);color:#cfc8db}
.clip-meta .ic{width:13px;height:13px}
.clip-d{margin-left:auto}
.clip.is-sel{box-shadow:0 0 0 2px var(--accent)}
.clip.is-live::before{content:"";position:absolute;left:10px;right:10px;top:-9px;height:3px;border-radius:2px;background:#f4a53a}
.clip-tag{position:absolute;top:6px;left:6px;font:600 9px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 5px;border-radius:4px;background:rgb(0 0 0 / .65);color:#eee8f5}
.clip-add{flex:none;width:136px;border:1.5px dashed #4d455c;border-radius:8px;background:none;color:#cfc8db;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;min-height:108px}
.clip-txt{background:#000!important;color:#fff;font:400 13px/1.15 'Gochi Hand','Segoe Print',cursive;text-align:center;padding:6px;overflow:hidden}
.clip-txt span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clip-add.txt{min-height:108px}
.clip-add:hover{border-color:#f4a53a;color:#f4a53a}
.sortable-ghost{opacity:.3}
.sortable-chosen{box-shadow:0 0 0 2px #f4a53a}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 92px);overflow:auto;min-width:0}
@media (max-width:980px){.panel{position:static;max-height:none}}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--surface);z-index:2;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.tab .ic{width:16px;height:16px}
.tab-body{padding:16px;display:flex;flex-direction:column;gap:22px}
.grp{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.grp legend{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;font-size:14px}
.field-l output,.field-l .mono{font:500 12px var(--f-mono);color:var(--muted)}
select,input[type=text]{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:3px;cursor:pointer}
.colors{display:flex;gap:8px;align-items:center}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:500;font-size:14px;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-ui{width:38px;height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw-ui::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw input:checked + .sw-ui{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .sw-ui::after{transform:translateX(16px);background:var(--accent-ink)}
.sw input:focus-visible + .sw-ui{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);margin:0;font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.sel-head{display:flex;gap:12px;align-items:center;min-width:0}
.sel-head .th{width:88px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none}
.sel-head .th img{width:100%;height:100%;object-fit:cover;display:block}
.sel-name{font-weight:600;overflow-wrap:anywhere;min-width:0}
.sel-kind{font:500 12px var(--f-mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:600 18px var(--f-mono)}
.stat span{font-size:12px;color:var(--muted)}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl-art{aspect-ratio:16/9;display:grid;place-items:center;padding:8px;text-align:center;line-height:1.05;font-size:17px;text-shadow:0 1px 6px rgb(0 0 0 / .35);overflow:hidden}
.tpl-l{padding:8px 10px 9px;font-weight:600;font-size:13px}
.tpl-s{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:2px}
.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.track{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.track.is-on{border-color:var(--accent)}
.track-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14px}
.track-d{font:500 12px var(--f-mono);color:var(--muted)}
.track button{width:30px;height:30px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.track button:hover{background:var(--surface-2);color:var(--fg)}
.track button .ic{width:16px;height:16px}
.mstat{font:500 12.5px var(--f-mono);color:var(--muted)}

/* Modal, drop, toasts */
.modal{position:fixed;inset:0;background:rgb(8 6 12 / .62);display:grid;place-items:center;z-index:200;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(540px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h2{font:700 22px var(--f-display);margin:0;letter-spacing:-.01em}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s linear}
.sheet video{width:100%;border-radius:10px;background:#000;max-height:42vh}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:13px}
.drop{position:fixed;inset:12px;z-index:150;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;border:3px dashed var(--accent);border-radius:20px;font:700 26px var(--f-display);pointer-events:none;text-align:center;padding:20px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.toast.err{background:var(--danger);color:#fff}
.projs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.proj{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.proj.is-cur{border-color:var(--accent)}
.proj-th{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#111;display:grid;place-items:center;color:#777}
.proj-th img{width:100%;height:100%;object-fit:cover;display:block}
.proj-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.proj-b b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-b .mono{font-size:11.5px;color:var(--muted)}
.proj-b .row{margin-top:4px;gap:6px}
.tpl{position:relative}
.tpl-main{all:unset;display:flex;flex-direction:column;cursor:pointer;width:100%;box-sizing:border-box}
.tpl-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.tpl-edit{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;border:0;background:rgb(0 0 0 / .55);color:#fff;display:grid;place-items:center;cursor:pointer}
.tpl-edit:hover{background:rgb(0 0 0 / .8)}
.tpl-edit .ic{width:16px;height:16px}
.help-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:h}
.help-steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;font-size:14.5px}
.help-steps li::before{counter-increment:h;content:counter(h);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:600 13px var(--f-mono)}
.help-steps b{display:block;font-weight:600;margin-bottom:2px}
.help-steps span{color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:18px 0 0;align-items:center}
.keys kbd{font:600 12px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;white-space:nowrap;justify-self:start}
.help-h{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 0}
.saved{font:500 12px var(--f-mono);color:var(--muted);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4L19.5 12z" fill="currentColor" stroke="none"/></symbol>

  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.5 5.5v13L15 12z" fill="currentColor" stroke="none"/><rect x="16.1" y="5.5" width="2.4" height="13" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.3 0 2.2-.4 3-1.2M13.5 8.2c.8-.8 1.7-1.2 3-1.2H21M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></symbol>
  <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M10 10v11"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.4M12 16.8v.2"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="top-in gut">
      <a class="brand" href="#" aria-label="Sarimihetsika">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="1" y="7" width="22" height="18" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
          <rect x="6" y="4" width="26" height="22" rx="3.5" fill="var(--accent)"/>
          <path d="M16.5 25.8c.4-3 .5-6 .4-9.2M16.9 16.6c-1.6-.7-3-1.8-3.8-3.2M16.9 16.6c1.5-.8 3-1.7 4.1-3.1M16.9 16.4c0-1.5.1-2.6.3-3.8" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M13.6 25.8h6.6" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="25.5" cy="10.5" r="2" fill="var(--accent-ink)"/>
        </svg>
        <span><b>Sarimihetsika</b><small data-i18n="brandTag">Studio diaporama</small></span>
      </a>
      <nav class="steps" aria-label="Dingana">
        <button class="step" data-step="1"><span class="n">1</span><span data-i18n="step1"></span></button>
        <button class="step" data-step="2"><span class="n">2</span><span data-i18n="step2"></span></button>
        <button class="step" data-step="3"><span class="n">3</span><span data-i18n="step3"></span></button>
        <button class="step" data-step="4"><span class="n">4</span><span data-i18n="step4"></span></button>
      </nav>
      <div class="top-actions">
        <span class="saved" id="saved" data-i18n="saved"></span>
        <button class="btn icon" id="bUndo" data-i18n-aria="undo" disabled><svg class="ic"><use href="#i-undo"/></svg></button>
        <button class="btn icon" id="bRedo" data-i18n-aria="redo" disabled><svg class="ic"><use href="#i-redo"/></svg></button>
        <button class="btn has-lbl" id="bProj"><svg class="ic"><use href="#i-folder"/></svg><span class="lbl-hide" data-i18n="myProjects"></span></button>
        <button class="btn has-lbl" id="bNew"><svg class="ic"><use href="#i-file"/></svg><span class="lbl-hide" data-i18n="newProj"></span></button>
        <span class="sep" aria-hidden="true"></span>
        <div class="seg" role="group" aria-label="Fiteny / Langue / Language">
          <button data-lang="mg" aria-pressed="true" title="Malagasy">MG</button>
          <button data-lang="fr" aria-pressed="false" title="Français">FR</button>
          <button data-lang="en" aria-pressed="false" title="English">EN</button>
        </div>
        <button class="btn icon" id="bHelp" data-i18n-aria="help"><svg class="ic"><use href="#i-help"/></svg></button>
        <button class="btn icon" id="bTheme" data-i18n-aria="theme"><svg class="ic"><use href="#i-moon"/></svg></button>
        <button class="btn primary has-lbl" id="bExport"><svg class="ic"><use href="#i-download"/></svg><span class="lbl-hide" data-i18n="export"></span></button>
      </div>
    </div>
  </header>

  <div class="tip-wrap gut" id="tipWrap" hidden>
    <div class="tip"><svg class="ic" aria-hidden="true"><use href="#i-sparkle"/></svg><p data-i18n="tip"></p><button class="btn mini" id="tipHelp" data-i18n="howTo"></button><button class="btn mini" id="tipClose" data-i18n="tipClose"></button></div>
  </div>

  <main class="work gut">
    <section class="left">
      <div class="stage" id="stage" aria-label="Fijerena">
        <canvas id="cv" width="1280" height="720"></canvas>
        <div class="hud" id="hud"></div>
        <div class="stage-empty" id="stageEmpty" hidden>
          <div>
            <h3 data-i18n="emptyTitle"></h3>
            <p data-i18n="emptyText"></p>
            <button class="btn primary" id="emptyAdd"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="addMedia"></span></button>
          </div>
        </div>
        <button class="btn icon kiosk-x" id="kioskX" data-i18n-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>

      <div class="transport">
        <div class="tp-group">
          <button class="tp-btn" id="bPrev" data-i18n-aria="prev"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="tp-btn tp-play" id="bPlay" data-i18n-aria="play"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="tp-btn" id="bNext" data-i18n-aria="next"><svg class="ic"><use href="#i-next"/></svg></button>
        </div>
        <div class="scrub">
          <span class="time" id="tCur">00:00.0</span>
          <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Toerana">
          <span class="time" id="tTot">00:00.0</span>
        </div>
        <div class="tp-group">
          <button class="tp-toggle" id="bShuffle" aria-pressed="true"><svg class="ic"><use href="#i-shuffle"/></svg><span data-i18n="shuffle"></span></button>
          <button class="tp-btn" id="bReshuffle" data-i18n-aria="reshuffle"><svg class="ic"><use href="#i-dice"/></svg></button>
          <button class="tp-toggle" id="bLoop" aria-pressed="true"><svg class="ic"><use href="#i-repeat"/></svg><span class="tp-lbl" data-i18n="loop"></span></button>
          <button class="tp-btn" id="bFull" data-i18n-aria="full"><svg class="ic"><use href="#i-expand"/></svg></button>
        </div>
      </div>

      <div class="strip-wrap">
        <div class="strip-head">
          <h2 data-i18n="stripTitle"></h2>
          <span class="meta" id="stripMeta"></span>
          <span class="hint" id="stripHint"></span>
        </div>
        <div class="strip" id="strip"></div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="media" aria-selected="true"><svg class="ic"><use href="#i-image"/></svg><span data-i18n="tabMedia"></span></button>
        <button class="tab" role="tab" data-tab="play" aria-selected="false"><svg class="ic"><use href="#i-sliders"/></svg><span data-i18n="tabPlay"></span></button>
        <button class="tab" role="tab" data-tab="music" aria-selected="false"><svg class="ic"><use href="#i-music"/></svg><span data-i18n="tabMusic"></span></button>
        <button class="tab" role="tab" data-tab="tpl" aria-selected="false"><svg class="ic"><use href="#i-layout"/></svg><span data-i18n="tabTpl"></span></button>
        <button class="tab" role="tab" data-tab="text" aria-selected="false"><svg class="ic"><use href="#i-type"/></svg><span data-i18n="tabText"></span></button>
      </div>

      <div class="tab-body" id="tb-media" role="tabpanel"></div>

      <div class="tab-body" id="tb-play" role="tabpanel" hidden>
        <fieldset class="grp">
          <legend data-i18n="grpOrder"></legend>
          <label class="sw"><input type="checkbox" id="sAutoplay" data-set="autoplay"><span class="sw-ui"></span><span data-i18n="autoplay"></span></label>
          <label class="sw"><input type="checkbox" id="sAutoFx" data-set="autoFx"><span class="sw-ui"></span><span data-i18n="autoFx"></span></label>
          <label class="sw"><input type="checkbox" id="sCountdown" data-set="countdown"><span class="sw-ui"></span><span data-i18n="countdown"></span></label>
          <label class="sw"><input type="checkbox" id="sShuffle" data-set="shuffle"><span class="sw-ui"></span><span data-i18n="shuffleLong"></span></label>
          <label class="sw"><input type="checkbox" id="sKeepEnds" data-set="keepEnds"><span class="sw-ui"></span><span data-i18n="keepEnds"></span></label>
          <label class="sw"><input type="checkbox" id="sLoop" data-set="loop"><span class="sw-ui"></span><span data-i18n="loop"></span></label>
          <div class="field">
            <label class="field-l" for="sDefDur"><span data-i18n="defDur"></span><output data-out="defDur"></output></label>
            <input type="range" id="sDefDur" data-set="defDur" min="1" max="30" step="0.5">
          </div>
        </fieldset>
        <fieldset class="grp">
          <legend data-i18n="grpMotion"></legend>
          <div class="field"><label class="field-l" for="sTrans"><span data-i18n="transition"></span></label><select id="sTrans" data-set="transition" data-opts="trans"></select></div>
          <div class="field">
            <label class="field-l" for="sTDur"><span data-i18n="tDur"></span><output data-out="tDur"></output></label>
            <input type="range" id="sTDur" data-set="tDur" min="0.3" max="3" step="0.1">
          </div>
          <div class="field"><label class="field-l" for="sEffect"><span data-i18n="defEffect"></span></label><select id="sEffect" data-set="effect" data-opts="eff"></select></div>
          <div class="field"><label class="field-l" for="sFilter"><span data-i18n="defFilter"></span></label><select id="sFilter" data-set="filter" data-opts="fil"></select></div>
          <div class="field"><label class="field-l" for="sOverlay"><span data-i18n="overlay"></span></label><select id="sOverlay" data-set="overlay" data-opts="ov"></select></div>
        </fieldset>
        <fieldset class="grp">
          <legend data-i18n="grpFrame"></legend>
          <div class="field"><span class="field-l" data-i18n="aspect"></span>
            <div class="seg" role="group" data-seg="aspect">
              <button data-val="16:9">16:9</button><button data-val="9:16">9:16</button><button data-val="1:1">1:1</button><button data-val="4:3">4:3</button>
            </div>
          </div>
          <div class="field"><span class="field-l" data-i18n="fit"></span>
            <div class="seg" role="group" data-seg="fit">
              <button data-val="cover" data-i18n="fitCover"></button><button data-val="contain" data-i18n="fitContain"></button><button data-val="blur" data-i18n="fitBlur"></button>
            </div>
          </div>
          <div class="field"><label class="field-l" for="sFrame"><span data-i18n="frameL"></span></label><select id="sFrame" data-set="frame" data-opts="frame"></select></div>
          <div class="field"><label class="field-l" for="sBg"><span data-i18n="bg"></span></label><div class="colors"><input type="color" id="sBg" data-set="bg"></div></div>
        </fieldset>
        <fieldset class="grp">
          <legend data-i18n="grpAdv"></legend>
          <div class="field"><label class="field-l" for="sBpm"><span data-i18n="bpm"></span><output data-out="bpm"></output></label><input type="range" id="sBpm" data-set="bpm" min="60" max="180" step="1"></div>
          <label class="sw"><input type="checkbox" id="sBeatZoom" data-set="beatZoom"><span class="sw-ui"></span><span data-i18n="beatZoom"></span></label>
          <label class="sw"><input type="checkbox" id="sBeatSnap" data-set="beatSnap"><span class="sw-ui"></span><span data-i18n="beatSnap"></span></label>
          <p class="note" data-i18n="advNote"></p>
        </fieldset>
      </div>

      <div class="tab-body" id="tb-music" role="tabpanel" hidden>
        <fieldset class="grp">
          <legend data-i18n="tabMusic"></legend>
          <ul class="tracks" id="tracks"></ul>
          <div class="row">
            <button class="btn" id="bAddMusic"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="addMusic"></span></button>
            <button class="btn" id="bSampleMusic"><svg class="ic"><use href="#i-sparkle"/></svg><span data-i18n="sampleMusic"></span></button>
          </div>
          <p class="mstat" id="mstat"></p>
        </fieldset>
        <fieldset class="grp">
          <legend data-i18n="grpSound"></legend>
          <div class="field">
            <label class="field-l" for="sMVol"><span data-i18n="musicVol"></span><output data-out="musicVol"></output></label>
            <input type="range" id="sMVol" data-set="musicVol" min="0" max="1" step="0.05">
          </div>
          <div class="field">
            <label class="field-l" for="sVVol"><span data-i18n="videoVol"></span><output data-out="videoVol"></output></label>
            <input type="range" id="sVVol" data-set="videoVol" min="0" max="1" step="0.05">
          </div>
          <label class="sw"><input type="checkbox" id="sFade" data-set="fadeAudio"><span class="sw-ui"></span><span data-i18n="fadeAudio"></span></label>
          <label class="sw"><input type="checkbox" id="sDuck" data-set="duck"><span class="sw-ui"></span><span data-i18n="duck"></span></label>
          <label class="sw"><input type="checkbox" id="sFitMusic" data-set="fitMusic"><span class="sw-ui"></span><span data-i18n="fitMusic"></span></label>
          <p class="note" data-i18n="rights"></p>
        </fieldset>
      </div>

      <div class="tab-body" id="tb-tpl" role="tabpanel" hidden>
        <fieldset class="grp">
          <legend data-i18n="tplTexts"></legend>
          <div class="field"><label class="field-l" for="tIntroT"><span data-i18n="introT"></span></label><input type="text" id="tIntroT" data-set="intro.title" maxlength="80"></div>
          <div class="field"><label class="field-l" for="tIntroS"><span data-i18n="introS"></span></label><input type="text" id="tIntroS" data-set="intro.sub" maxlength="80"></div>
          <div class="field"><label class="field-l" for="tOutroT"><span data-i18n="outroT"></span></label><input type="text" id="tOutroT" data-set="outro.title" maxlength="80"></div>
          <label class="sw"><input type="checkbox" id="tAutoFx" data-set="autoFx"><span class="sw-ui"></span><span data-i18n="autoFx"></span></label>
          <label class="sw"><input type="checkbox" id="tKeep" data-set="keepText"><span class="sw-ui"></span><span data-i18n="keepText"></span></label>
          <label class="sw"><input type="checkbox" id="tCountdown" data-set="countdown"><span class="sw-ui"></span><span data-i18n="countdown"></span></label>
          <div class="row"><button class="btn mini" id="bChapters"><svg class="ic"><use href="#i-type"/></svg><span data-i18n="addChapters"></span></button></div>
        </fieldset>
        <div class="row" style="justify-content:space-between"><p class="note" data-i18n="tplHint" style="flex:1;min-width:0"></p><span class="mstat" id="tplCount"></span></div>
        <div class="seg" role="group" id="tplCats" style="align-self:flex-start"></div>
        <div class="tpls" id="tpls"></div>
      </div>

      <div class="tab-body" id="tb-text" role="tabpanel" hidden>
        <fieldset class="grp">
          <legend data-i18n="intro"></legend>
          <label class="sw"><input type="checkbox" id="sIntroOn" data-set="intro.on"><span class="sw-ui"></span><span data-i18n="show"></span></label>
          <div class="field"><label class="field-l" for="sIntroT"><span data-i18n="titleL"></span></label><input type="text" id="sIntroT" data-set="intro.title" maxlength="80"></div>
          <div class="field"><label class="field-l" for="sIntroS"><span data-i18n="subL"></span></label><input type="text" id="sIntroS" data-set="intro.sub" maxlength="80"></div>
          <div class="field"><label class="field-l" for="sIntroBg"><span data-i18n="tbgL"></span></label><select id="sIntroBg" data-set="intro.bg" data-opts="tbg"></select></div>

  $('#bShuffle').onclick = () => setShuffle(!S.settings.shuffle);
  $('#bReshuffle').onclick = () => { if (!S.settings.shuffle) return; shuffleOrder(order[order.length - 1]); buildSeq(); seekTo(0); renderStrip(); toast(t('shuffled')); };
  $('#bLoop').onclick = () => { S.settings.loop = !S.settings.loop; fillSettingsUI(); commit(); };
  $('#bFull').onclick = toggleFull; $('#kioskX').onclick = toggleFull;
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
  $('#bNew').onclick = () => newProject();
  $('#bProj').onclick = openProjects; $('#pClose').onclick = () => { $('#mProj').hidden = true; };
  $('#pNew').onclick = async () => { $('#mProj').hidden = true; await newProject(); };
  $('#pName').oninput = e => { S.name = e.target.value; saveSoon(); };
  $('#pSave').onclick = async () => { S.name = $('#pName').value.trim() || defaultName(); await save(); await renderProjects(); toast(t('savedNow').replace('{n}', S.name)); };
  $('#teClose').onclick = () => { $('#mTpl').hidden = true; }; $('#teSave').onclick = () => saveTplEdit(false); $('#teReset').onclick = () => saveTplEdit(true);
  ['#mProj', '#mTpl'].forEach(q => $(q).addEventListener('click', e => { if (e.target === $(q)) $(q).hidden = true; }));
  $('#bExport').onclick = openExport;
  $('#exClose').onclick = () => { if (exporting) cancelExport(); $('#mExport').hidden = true; };
  $('#mExport').addEventListener('click', e => { if (e.target.id === 'mExport' && !exporting) $('#mExport').hidden = true; });
  $$('#exQ button').forEach(b => b.onclick = () => { exQ = b.dataset.q; $$('#exQ button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#exStart').onclick = startExport; $('#exCancel').onclick = cancelExport;
  $('#bTheme').onclick = () => { const next = effectiveDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; ls.set('sm.theme', next); setThemeIcon(); };
  $$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; ls.set('sm.lang', lang); renderAll(); if (!$('#mHelp').hidden) openHelp(); });
  $$('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $$('.step').forEach(b => b.onclick = () => { const n = +b.dataset.step;
    if (n === 1) { showTab('media'); $('#fMedia').click(); } if (n === 2) showTab('tpl'); if (n === 3) showTab('music'); if (n === 4) { if (S.items.length) play(); openExport(); }
    if (n !== 4 && innerWidth < 980) $('#panel').scrollIntoView({ behavior:'smooth', block:'start' }); });
  $('#emptyAdd').onclick = e => { e.stopPropagation(); $('#fMedia').click(); };
  $('#fMedia').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
  $('#fMusic').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; for (const f of fs) { try { await addMusicFile(f); } catch (er) { toast(t('fileErr').replace('{f}', f.name), 'err'); } } buildSeq(); renderMusic(); renderStrip(); commit(); };
  $('#bAddMusic').onclick = () => $('#fMusic').click();
  $('#bChapters').onclick = addChapters;
  let upFor = 'intro';
  $$('[data-upload]').forEach(b => b.onclick = () => { upFor = b.dataset.upload; $('#fTitleImg').click(); });
  $('#fTitleImg').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const blob = await prepImage(f), id = uid(); const ok = await registerMedia(id, blob, 'image', f.name); if (!ok) throw 0;
      S.titleImgs.push({ id, name:f.name.replace(/\.[^.]+$/, '') }); const d = S.settings[upFor]; d.imgId = id; d.bg = 'image';
      fillImgOptions(); onSetting(upFor + '.imgId'); commit();
    } catch (er) { toast(t('fileErr').replace('{f}', f.name), 'err'); }
  };
  $('#bSampleMusic').onclick = makeSampleMusic;
  $('#tipClose').onclick = () => { $('#tipWrap').hidden = true; ls.set('sm.tip', 1); };
  let dragN = 0; const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN++; $('#drop').hidden = false; });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').hidden = true; });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; $('#drop').hidden = true; importFiles([...e.dataTransfer.files]); });
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod) return;
    if (e.key === ' ' && !e.target.closest('button,[role=button]')) { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key.toLowerCase() === 'f') toggleFull(); else if (e.key.toLowerCase() === 's') setShuffle(!S.settings.shuffle);
    else if (e.key === 'Escape') { $('#stage').classList.remove('is-kiosk'); $('#mHelp').hidden = true; $('#mProj').hidden = true; $('#mTpl').hidden = true; if (!exporting) $('#mExport').hidden = true; }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing && !exporting) pause(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', setThemeIcon);
  mus.addEventListener('ended', () => { mus.dataset.id = ''; });
}

/* ---------- boot ---------- */
async function boot() {
  const th = ls.get('sm.theme', null); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  setThemeIcon(); bindSettings(); bindEvents(); applyI18n(); fillOptions(); fillSettingsUI();
  requestAnimationFrame(frame);
  let restored = false;
  try { await DB.open(); dbOK = true; } catch (e) { dbOK = false; }
  if (dbOK) {
    try {
      let ix = await readIndex();
      const legacy = await DB.get('kv', 'project');
      if (legacy && Array.isArray(legacy.items)) {
        const id = uid(); legacy.name = legacy.name || t('projWord') + ' 1'; await DB.put('kv', projKey(id), legacy);
        ix.unshift({ id, name:legacy.name, updated:Date.now(), n:legacy.items.length, dur:0 }); await writeIndex(ix); await DB.del('kv', 'project'); ls.set('sm.proj', id);
      }
      const want = ls.get('sm.proj', null), id = ix.some(x => x.id === want) ? want : (ix[0] && ix[0].id);
      if (id) restored = await loadProject(id);
    } catch (e) { restored = false; }
  }
  if (!restored) { projId = uid(); ls.set('sm.proj', projId); S.name = defaultName(); }
  if (!restored) { await makeSamples(); }
  sel = null; setPreviewSize(); loadFont(S.settings.font); FONTS.forEach(loadFont);
  shuffleOrder(); buildSeq(); renderAll(); lastSnap = snap(); updUndo();
  if (!restored) save(); else save().then(gcBlobs);
  if (!ls.get('sm.tip', 0)) $('#tipWrap').hidden = false;
  if (S.settings.autoplay && seq.length) { seekTo(0); play(); }
  try {
    const canPwa = location.protocol === 'https:' && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
    if (canPwa) {
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
}
boot();
})();
</script>
